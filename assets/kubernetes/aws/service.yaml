apiVersion: v1
kind: Service
metadata:
  name: &app-name svc-py-mcp-inventory-v2
  namespace: test-a
  labels:
    app: *app-name
spec:
  type: ClusterIP
  ports:
  - port: 7500
    targetPort: 7500
    protocol: TCP
    name: http
  selector:
    app: py-mcp-inventory-v2

---

apiVersion: v1
kind: Service
metadata:
  name: &app-name svc-py-mcp-inventory-v2-metrics
  namespace: test-a
  labels:
    app: *app-name
spec:
  type: ClusterIP
  ports:
  - port: 8500
    targetPort: 8500
    protocol: TCP
    name: http
  selector:
    app: py-mcp-inventory-v2